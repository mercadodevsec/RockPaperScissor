openapi: 3.0.0
info:
  title: Rock-Paper-Scissors API
  version: 1.0.0
  description: API for player authentication, game play, history, and public player statistics.
servers:
  - url: http://localhost:3000/api
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: player1
        password:
          type: string
          example: secretPassword123
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    RoundResult:
      type: object
      properties:
        playerMove:
          type: string
          enum: [rock, paper, scissor]
        botMove:
          type: string
          enum: [rock, paper, scissor]
        outcome:
          type: string
          enum: [win, lose, draw]
        message:
          type: string
        roundWinner:
          type: string
          enum: [player, bot]
    RoundResultResponse:
      type: object
      properties:
        message:
          type: string
        result:
          $ref: '#/components/schemas/RoundResult'
    SaveGameRequest:
      type: object
      required:
        - result
        - playerTally
        - botTally
        - rounds
      properties:
        result:
          type: string
          enum: [win, lose, draw]
        playerTally:
          type: integer
        botTally:
          type: integer
        rounds:
          type: array
          items:
            type: object
            required:
              - playerMove
              - botMove
              - outcome
            properties:
              playerMove:
                type: string
                enum: [rock, paper, scissor]
              botMove:
                type: string
                enum: [rock, paper, scissor]
              outcome:
                type: string
                enum: [win, lose, draw]
    GameSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        result:
          type: string
          enum: [win, lose, draw]
        playerTally:
          type: integer
        botTally:
          type: integer
        createdAt:
          type: string
          format: date-time
    PlayerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    PlayerGamesResponse:
      type: object
      properties:
        player:
          $ref: '#/components/schemas/PlayerSummary'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
    PlayerStatsResponse:
      type: object
      properties:
        player:
          $ref: '#/components/schemas/PlayerSummary'
        stats:
          type: object
          properties:
            totalGames:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
            draws:
              type: integer
            winPercentage:
              type: integer
            totalRounds:
              type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
paths:
  /auth/register:
    post:
      summary: Register a new player account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Player registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Player login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Player logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid login data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/results:
    get:
      summary: Play a round of Rock-Paper-Scissors
      parameters:
        - in: query
          name: move
          required: true
          schema:
            type: string
            enum: [rock, paper, scissor]
      responses:
        '200':
          description: Round outcome returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundResultResponse'
        '400':
          description: Invalid move parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/save:
    post:
      summary: Save a finished game for the authenticated player
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveGameRequest'
      responses:
        '201':
          description: Game saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  gameId:
                    type: string
                    format: uuid
        '400':
          description: Invalid game payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/me/games:
    get:
      summary: Load authenticated player game history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Player game history returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameSummary'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/{gameId}:
    get:
      summary: Load authenticated player's game details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: gameId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game details returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  game:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      playerId:
                        type: string
                        format: uuid
                      result:
                        type: string
                        enum: [win, lose, draw]
                      playerTally:
                        type: integer
                      botTally:
                        type: integer
                      createdAt:
                        type: string
                        format: date-time
                      player:
                        $ref: '#/components/schemas/PlayerSummary'
                      rounds:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoundResult'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden to access this game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/search:
    get:
      summary: Search for player accounts by username
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching players returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlayerSummary'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{playerId}/games:
    get:
      summary: Load public game history for a player
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Player public games returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{playerId}/stats:
    get:
      summary: Load public statistics for a player
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: playerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Public player statistics returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Player not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
